<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="新規事業ウケるかな？パネル">
  <title>新規事業ウケるかな？パネル</title>
  <rect width="32" height="32" fill="#000" />
  <rect x="3" y="3" width="26" height="26" fill="#fff" />
  <!-- 3つの列。塗り／斜線／白抜きで「興味の強さ」の順序を表す -->
  <rect x="11.4" y="3" width="1.6" height="26" fill="#000" />
  <rect x="19" y="3" width="1.6" height="26" fill="#000" />
  <!-- 左：塗り。人数が少ないので手前だけ埋まる -->
  <rect x="5" y="21" width="5" height="8" fill="#000" />
  <!-- 中：斜線 -->
  <rect x="14.4" y="12" width="3.2" height="17" fill="#000" />
  <rect x="14.4" y="12" width="3.2" height="2" fill="#fff" />
  <rect x="14.4" y="17" width="3.2" height="2" fill="#fff" />
  <rect x="14.4" y="22" width="3.2" height="2" fill="#fff" />
  <!-- 右：白抜き -->
  <rect x="22" y="15" width="5" height="14" fill="#fff" stroke="#000" stroke-width="1.6" />
</svg>
